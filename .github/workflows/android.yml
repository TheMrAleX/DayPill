name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list > "$RUNNER_TEMP/android-packages.txt"
          platform=$(awk -F '|' '{gsub(/^[ \t]+|[ \t]+$/, "", $1); if ($1 == "platforms;android-37.0") print $1}' "$RUNNER_TEMP/android-packages.txt" | head -n 1)
          if [[ -z "$platform" ]]; then
            grep 'android-37' "$RUNNER_TEMP/android-packages.txt" || true
            platform=$(awk -F '|' '{gsub(/^[ \t]+|[ \t]+$/, "", $1); if ($1 == "platforms;android-37") print $1}' "$RUNNER_TEMP/android-packages.txt" | head -n 1)
          fi
          if [[ -z "$platform" ]]; then
            echo "::error::Stable Android API 37 platform is unavailable."
            exit 1
          fi
          echo "Installing $platform"
          sdkmanager --install "$platform" "build-tools;36.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Test, lint and assemble debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Verify committed Room schema
        run: git diff --exit-code -- app/schemas
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: pastillero-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload database schema and verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pastillero-verification
          path: |
            app/schemas/**/*.json
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
      - name: Verify H3 navigation on Android 17
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "emulator" "system-images;android-37.0;google_apis;x86_64"
          sudo chmod 666 /dev/kvm
          printf 'no\n' | avdmanager create avd --force --name pastillero-ci --package "system-images;android-37.0;google_apis;x86_64" --device "pixel_7_pro"
          mkdir -p ui-verification
          "$ANDROID_HOME/emulator/emulator" -avd pastillero-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 3072 > ui-verification/emulator.log 2>&1 &
          trap 'adb emu kill || true' EXIT
          timeout 300 adb wait-for-device
          timeout 300 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == "1" ]]; do sleep 3; done'
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          python scripts/verify_navigation.py
      - name: Upload H3 emulator screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pastillero-ui-h3
          path: ui-verification/
          if-no-files-found: warn
